<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request a Callback</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Request a Callback</h1>
  </header>
  <main>
    <form action="mailto:contact@majalisalfarah.sa" method="POST">
      <label>Name:<br><input type="text" name="name" required></label><br>
      <label>Phone Number:<br><input type="text" name="phone" required></label><br>
      <label>Best Time to Call:<br><input type="text" name="time"></label><br>
      <button type="submit">Request Call</button>
    </form>
  </main>
</body>
</html>
