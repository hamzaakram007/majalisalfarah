<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Design Your Sofa</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Sofa Customizer</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="catalog/product-list.html">Products</a>
    </nav>
  </header>

  <main>
    <h2>Create Your Custom Sofa</h2>
    <form>
      <label>Choose Size:
        <select>
          <option>2-Seater</option>
          <option>3-Seater</option>
          <option>L-Shape</option>
        </select>
      </label>
      <label>Fabric Color:
        <input type="color" name="fabricColor" />
      </label>
      <label>Foam Type:
        <select>
          <option>Soft</option>
          <option>Medium</option>
          <option>Hard</option>
        </select>
      </label>
      <button type="submit">Preview Design</button>
    </form>
    <p style="margin-top:20px;">💡 You can request this design using the <a href="order-form.html">custom order form</a>.</p>
  </main>

  <footer>
    <p>© 2025 Majalis Alfarah</p>
  </footer>
</body>
</html>
